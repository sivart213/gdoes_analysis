[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "gdoes_analysis"
version = "0.0.1"
description = "Package for parsing and evaluating GDOES data files."
authors = [
  { name = "JClenney" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = "~=3.10"


[tool.setuptools.packages.find]
where = ["gdoes_analysis"]

[tool.setuptools.package-data]
"gdoes_analysis.testing.data" = ["202309_conv.jy", "202309.jys", "set4a_r5_conv.jy", "set4A r5_3.jys"]

[tool.black]
line-length = 99
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff]
line-length = 99
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # E: pycodestyle errors, F: pyflakes, W: warnings, I: isort
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["gdoes_analysis"]
length-sort = true


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-line-length = 200

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "--tb=short", "--color=yes"]
testpaths = [
    "tests",
    "gdoes_analysis"
]

